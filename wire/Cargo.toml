# Note that Cargo is not an officially supported build tool (Android's Soong is the official
# tool).  This Cargo.toml file is included purely for the convenience of developers.

[package]
name = "weaver-wire"
version = "0.1.0"
authors = ["Karuna Wadhera <kwadhera@google.com>"]
edition = "2021"
license = "Apache-2.0"

[dependencies]
ciborium = { version = "^0.2.2", default-features = false }
ciborium-io = "^0.2.0"
enumn = "0.1.4"
hal-wire = "*"
hal-wire-derive = "*"
log = "^0.4"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
